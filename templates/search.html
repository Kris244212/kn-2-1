{% extends "base.html" %}
{% block content %}
<h2>Результати пошуку</h2>

{% if trains %}
    {% for train in trains %}
        <p>
            {{ train.from_city }} → {{ train.to_city }} |
            {{ train.date }} |
            Вільних місць: {{ train.seats }}
            <a href="/book/{{ train.id }}">Забронювати</a>
        </p>
    {% endfor %}
{% else %}
    <p>Поїздів не знайдено</p>
{% endif %}

<a href="/dashboard">Назад</a>
{% endblock %}
